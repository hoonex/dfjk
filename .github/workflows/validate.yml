name: Validate Recall Rush

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check app.js
      - name: Verify scaffolded learning system and starter content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')

          starter_ids = re.findall(r'\{\s*id:\s*"q(\d+)"\s*,\s*cue:', app)
          assert starter_ids == [str(i) for i in range(1, 12)], f'expected starter q1-q11, got {starter_ids}'

          expected_answers = [
              'I am interested in AI because it can make our lives easier.',
              'My smartphone changed my daily life because it makes many things easier.',
              'I think technology makes human connections stronger because we can communicate more easily.',
              'I think AI will replace some jobs, but it will also create new jobs.',
              'The biggest problem is that AI may use personal information without permission.',
              'Society should give free digital lessons and cheaper devices to everyone.',
              'This issue relates to my future computer science major because I want to build useful technology.',
              'If I become a software engineer, I want to create safe AI tools for everyone.',
              'We need knowledge of technology, science, math, and communication to solve problems.',
              'I am optimistic because technology can make our lives easier and better.',
              'Humans should use advanced technology wisely and always keep people in control.',
          ]
          for answer in expected_answers:
              assert answer in app, f'missing exact starter answer: {answer}'

          for exercise_type in ('expose', 'choose', 'chunkOrder', 'order', 'cloze', 'typePart', 'recall'):
              assert re.search(rf'\b{exercise_type}\s*:', app), f'missing exercise type: {exercise_type}'

          for lesson_kind in ('discover', 'chunks', 'build', 'recall', 'checkpoint', 'final'):
              assert re.search(rf'\b{lesson_kind}\s*:', app), f'missing lesson kind: {lesson_kind}'

          for marker in (
              'function buildPath',
              'function generateExercises',
              'function chunksOf',
              'function remediationType',
              'function queueRemediation',
              'function startPractice',
              'function parseBulk',
              'function saveCourse',
              'function openOrderSettings',
              'function validCompletedLessonIds',
          ):
              assert marker in app, f'missing V3 capability: {marker}'

          for marker in ('courseEditorDialog', 'courseLibraryDialog', 'orderDialog', 'practiceDialog', 'statsDialog', 'exerciseBody'):
              assert marker in html, f'missing UI surface: {marker}'

          assert 'assets/mori.svg' in html, 'mascot asset is not referenced'
          assert 'styles.css' in html and 'app.js' in html, 'static assets are not linked'
          print('V3 scaffolded-learning checks passed')
          PY
      - name: Smoke serve
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/recall-rush-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:4173/index.html | grep -q 'Recall Rush'
