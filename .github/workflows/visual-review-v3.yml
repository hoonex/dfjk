name: Visual Review V3

on:
  push:
    branches:
      - feat/scaffolded-learning-engine-v3

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          google-chrome --version
      - name: Build preview states
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text(encoding='utf-8')
          states = {
            'expose': "window.addEventListener('load',()=>setTimeout(()=>{const l=state.path.find(x=>x.kind==='discover');startLesson(l,lessonItems(l));},250));",
            'choose': "window.addEventListener('load',()=>setTimeout(()=>{const l=state.path.find(x=>x.kind==='discover');startLesson(l,lessonItems(l));state.session.position=1;renderExercise();},250));",
            'chunks': "window.addEventListener('load',()=>setTimeout(()=>{const l=state.path.find(x=>x.kind==='chunks');startLesson(l,lessonItems(l));},250));",
            'order': "window.addEventListener('load',()=>setTimeout(()=>{const l=state.path.find(x=>x.kind==='build');startLesson(l,lessonItems(l));},250));",
            'cloze': "window.addEventListener('load',()=>setTimeout(()=>{const l=state.path.find(x=>x.kind==='build');startLesson(l,lessonItems(l));state.session.position=1;renderExercise();},250));",
            'partial': "window.addEventListener('load',()=>setTimeout(()=>{const l=state.path.find(x=>x.kind==='recall');startLesson(l,lessonItems(l));},250));",
            'practice': "window.addEventListener('load',()=>setTimeout(()=>openPracticeHub(),250));",
            'editor': "window.addEventListener('load',()=>setTimeout(()=>openCourseEditor(),250));",
          }
          for name, js in states.items():
              Path(f'preview-{name}.html').write_text(source.replace('</body>', f'<script>{js}</script></body>'), encoding='utf-8')
          PY
      - name: Serve
        run: |
          python3 -m http.server 4173 >/tmp/site.log 2>&1 &
          echo $! > /tmp/site.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null
      - name: Capture states
        run: |
          mkdir -p screenshots
          CHROME='google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800'
          $CHROME --window-size=1440,1100 --screenshot=screenshots/home-desktop.png http://127.0.0.1:4173/index.html
          $CHROME --window-size=390,844 --screenshot=screenshots/home-mobile.png http://127.0.0.1:4173/index.html
          for state in expose choose chunks order cloze partial practice editor; do
            $CHROME --window-size=390,844 --screenshot=screenshots/${state}-mobile.png http://127.0.0.1:4173/preview-${state}.html
          done
      - uses: actions/upload-artifact@v4
        with:
          name: recall-rush-v3-review
          path: screenshots
