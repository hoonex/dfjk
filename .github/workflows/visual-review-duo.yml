name: Visual Review Duo-like UI

on:
  push:
    branches:
      - feat/duo-like-recall-path
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Build lesson preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          html = html.replace('class="screen home-screen"', 'class="screen home-screen is-hidden"', 1)
          html = html.replace('class="screen lesson-screen is-hidden"', 'class="screen lesson-screen"', 1)
          html = html.replace('<h3 id="questionCue"></h3>', '<h3 id="questionCue">What specific future technology...</h3>', 1)
          html = html.replace('<span id="questionCounter">1 / 5</span>', '<span id="questionCounter">1 / 5</span>', 1)
          Path('lesson-preview.html').write_text(html, encoding='utf-8')
          PY
      - name: Serve
        run: |
          python3 -m http.server 8000 > /tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/site.log
          exit 1
      - name: Capture
        run: |
          mkdir -p visual-review
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1100 --screenshot=visual-review/home-desktop.png http://127.0.0.1:8000/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-review/home-mobile.png http://127.0.0.1:8000/
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=visual-review/lesson-desktop.png http://127.0.0.1:8000/lesson-preview.html
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-review/lesson-mobile.png http://127.0.0.1:8000/lesson-preview.html
      - uses: actions/upload-artifact@v4
        with:
          name: recall-rush-duo-review
          path: visual-review/*.png
          if-no-files-found: error
