name: Visual Review Course Builder V2

on:
  push:
    branches:
      - feat/course-builder-progression-v2

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          google-chrome --version
      - name: Build preview states
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text(encoding='utf-8')
          states = {
            'library': "window.addEventListener('load',()=>setTimeout(()=>openCourseLibrary(),250));",
            'editor': "window.addEventListener('load',()=>setTimeout(()=>openCourseEditor(),250));",
            'order': "window.addEventListener('load',()=>setTimeout(()=>openOrderSettings(),250));",
            'lesson': "window.addEventListener('load',()=>setTimeout(()=>{state.selectedLessonId=state.path[0]?.id;startSelectedLesson();},250));",
          }
          for name, js in states.items():
              Path(f'preview-{name}.html').write_text(source.replace('</body>', f'<script>{js}</script></body>'), encoding='utf-8')
          PY
      - name: Serve
        run: |
          python3 -m http.server 4173 >/tmp/site.log 2>&1 &
          echo $! > /tmp/site.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null
      - name: Capture desktop and mobile states
        run: |
          mkdir -p screenshots
          CHROME='google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800'
          $CHROME --window-size=1440,1100 --screenshot=screenshots/home-desktop.png http://127.0.0.1:4173/index.html
          $CHROME --window-size=390,844 --screenshot=screenshots/home-mobile.png http://127.0.0.1:4173/index.html
          $CHROME --window-size=390,844 --screenshot=screenshots/library-mobile.png http://127.0.0.1:4173/preview-library.html
          $CHROME --window-size=390,844 --screenshot=screenshots/editor-mobile.png http://127.0.0.1:4173/preview-editor.html
          $CHROME --window-size=390,844 --screenshot=screenshots/order-mobile.png http://127.0.0.1:4173/preview-order.html
          $CHROME --window-size=390,844 --screenshot=screenshots/lesson-mobile.png http://127.0.0.1:4173/preview-lesson.html
      - uses: actions/upload-artifact@v4
        with:
          name: recall-rush-course-v2-review
          path: screenshots
